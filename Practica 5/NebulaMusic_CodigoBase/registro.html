<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card">

            <form class="auth-form" method="post" action="/crear-cuenta">
                <section class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" minlength="3" required>
                </section>

                <section class="form-group">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                </section>

                <section class="form-group">
                    <label for="contrasenia">Contraseña:</label>
                    <input type="password" id="contrasenia" name="contrasenia" required>
                </section>

                <section class="form-group">
                    <label for="txt_pseudonimo">Pseudónimo:</label>
                    <input type="text" id="txt_pseudonimo" name="txt_pseudonimo" pattern="[a-zA-Z]{3,10}-[0-9]{2,10}" required>
                </section>

                <section class="form-group">
                    <label>Género:</label>
                    <span>
                            <input type="radio" id="femenino" name="rad_genero" value="femenino" required>
                            <label for="femenino">Femenino</label>
                        </span>
                    <span>
                            <input type="radio" id="masculino" name="rad_genero" value="masculino">
                            <label for="masculino">Masculino</label>
                        </span>
                    <span>
                            <input type="radio" id="otro" name="rad_genero" value="otro">
                            <label for="otro">Otro</label>
                        </span>
                </section>

                <section class="form-group">
                    <label for="sel_suscripcion">Tipo de Suscripción:</label>
                    <select id="sel_suscripcion" name="sel_suscripcion" required>
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="gratis">Gratis</option>
                        <option value="mensual">Mensual</option>
                        <option value="anual">Anual</option>
                    </select>
                </section>

                <section class="form-group">
                    <label for="fechaNacimiento">Fecha de nacimiento:</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                </section>

                <section class="form-group">
                    <input type="checkbox" id="chk_terminos" name="chk_terminos" required>
                    <label for="chk_terminos">Acepto los términos y condiciones</label>
                </section>

                <section class="form-group">
                    <label for="comentarios">Comentarios adicionales o gustos:</label>
                    <textarea id="comentarios" name="comentarios" rows="4"></textarea>
                </section>

                <section class="form-actions">
                    <button type="submit">Registrar</button>
                    <button type="reset">Restablecer</button>
                </section>
            </form>

        </section>
    </main>

    <footer>
        <p>Copyright Nébula 2025.</p>
    </footer>

</body>
</html>
